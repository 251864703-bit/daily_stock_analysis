name: 每日股票分析进阶版

on:
  schedule:
   # 1. 北京时间 09:35 (UTC 01:35) - 开盘异动捕捉
    - cron: '35 1 * * 1-5'
    # 2. 北京时间 14:45 (UTC 06:45) - 尾盘博弈决策
    - cron: '45 6 * * 1-5'
    # 3. 北京时间 18:00 (UTC 10:00) - 收盘总结
    - cron: '0 10 * * 1-5'
  
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'stocks-only'
        type: choice
        options: [full, market-only, stocks-only]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install openai pandas yfinance requests akshare efinance
          [ -f requirements.txt ] && (grep -v "pandas_ta" requirements.txt > req_new.txt && pip install -r req_new.txt || echo "skip")

      - name: 执行分析 (结构化监控模式)
        env:
          # 核心 API 配置
          OPENAI_API_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          OPENAI_BASE_URL: "https://api.deepseek.com"
          OPENAI_MODEL: "deepseek-chat"
          MODEL_NAME: "deepseek-chat"
          
          # 企业微信通知通道 (已接通)
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          
          # 股票清单与行情配置
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519' }}
          REALTIME_SOURCE_PRIORITY: "tencent,akshare_sina,efinance"
          TUSHARE_TOKEN: "" 
        run: |
          # 获取北京时间小时
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          echo "=========================================="
          echo "⏰ 当前北京时间: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          
          if [ "$HOUR" -eq 9 ] || [ "$HOUR" -eq 10 ]; then
            echo "🚀 模式：【早盘异动监控】"
            echo "重点：识别开盘量能，标注关键支撑/压力位"
            python main.py --no-market-review
          elif [ "$HOUR" -eq 14 ]; then
            echo "🔔 模式：【尾盘决策提醒】"
            echo "重点：给出明确买卖建议，防止破位或确认突破"
            python main.py --no-market-review
          else
            echo "📊 模式：【全天总结复盘】"
            echo "重点：技术面趋势深度分析，更新明日观察位"
            python main.py --no-market-review
          fi
          echo "=========================================="

      - name: 结果展示
        if: always()
        run: |
          echo "📝 检查分析报告内容..."
          find reports -name "*.md" -exec cat {} + || echo "未发现报告"
      
      - name: 上传产出文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-results-${{ github.run_number }}
          path: |
            reports/
            logs/
